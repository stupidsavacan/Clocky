name: Clocky Export Aligned APK Text

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require preinstalled JDK 17 and Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          java -version 2>&1 | tee /tmp/clocky-java-version.txt
          grep -Eq 'version "17([.]|\")' /tmp/clocky-java-version.txt
          javac -version 2>&1 | grep -Eq '^javac 17([.]|$)'

          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set on the runner}"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"

          echo "Using runner-preinstalled Java 17 and Android SDK 35 / Build Tools 35.0.0."
          echo "No sdkmanager or Android toolchain download is performed by this workflow."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and align unsigned APK
        shell: bash
        run: |
          rm -rf mvp-work build-aligned-text
          mkdir -p mvp-work build-aligned-text/data
          unzip -q ci/Clocky_MVP_source.zip -d mvp-work
          gradle --no-daemon -p mvp-work/clocky_mvp :app:assembleRelease
          U="$GITHUB_WORKSPACE/mvp-work/clocky_mvp/app/build/outputs/apk/release/app-release-unsigned.apk"
          A="$GITHUB_WORKSPACE/Clocky-MVP-aligned-unsigned.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -f 4 "$U" "$A"
          sha256sum "$A" > build-aligned-text/apk-SHA256.txt
          base64 -w0 "$A" | split -b 5000 -d -a 3 - build-aligned-text/data/part-
          for f in build-aligned-text/data/part-*; do sha256sum "$f"; done > build-aligned-text/chunk-SHA256SUMS.txt

      - name: Commit text export
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-aligned-text
          git commit -m "Export aligned unsigned Clocky APK as text chunks"
          git push origin HEAD:agent/mvp-java
