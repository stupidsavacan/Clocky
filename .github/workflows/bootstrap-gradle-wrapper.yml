name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - agent/compile-bootstrap
    paths:
      - '.github/workflows/bootstrap-gradle-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Wrapper smoke check
        run: ./gradlew --version

      - name: Commit wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo 'Wrapper already current'
            exit 0
          fi
          git commit -m 'Add Gradle 8.9 wrapper'
          git push origin HEAD:agent/compile-bootstrap
