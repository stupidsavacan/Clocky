name: Diagnose aggregate unit test

on:
  push:
    branches:
      - agent/widget-size-config-ui
    paths:
      - '.github/workflows/diagnose-aggregate-unit-test.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - id: full_suite
        name: Run aggregate unit test
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Check FontWeightResolverTest report
        run: ./tools/ci/check_junit_class.sh com.stupidsavacan.clocky.customization.font.FontWeightResolverTest
      - name: Check RemoteViewsFontWeightPolicyTest report
        run: ./tools/ci/check_junit_class.sh com.stupidsavacan.clocky.customization.font.RemoteViewsFontWeightPolicyTest
      - name: Check DigitalWidgetProfileResolverTest report
        run: ./tools/ci/check_junit_class.sh com.stupidsavacan.clocky.customization.model.DigitalWidgetProfileResolverTest
      - name: Check WidgetSettingsTest report
        run: ./tools/ci/check_junit_class.sh com.stupidsavacan.clocky.customization.model.WidgetSettingsTest
      - name: Check WidgetProfileDateVisibilityEditorTest report
        run: ./tools/ci/check_junit_class.sh com.stupidsavacan.clocky.customization.ui.WidgetProfileDateVisibilityEditorTest
      - name: Check WidgetProfileSizeEditorTest report
        run: ./tools/ci/check_junit_class.sh com.stupidsavacan.clocky.customization.ui.WidgetProfileSizeEditorTest
      - name: Check WidgetProfileWeightEditorTest report
        run: ./tools/ci/check_junit_class.sh com.stupidsavacan.clocky.customization.ui.WidgetProfileWeightEditorTest
      - name: Require aggregate success after report checks
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.full_suite.outcome }}' != 'success' ]; then
            echo 'Aggregate Gradle test task failed; class report checks above identify assertion failures when present.'
            exit 1
          fi
