name: Apply widget config manifest

on:
  push:
    branches:
      - agent/widget-weight-config-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/widget-weight-config-ui
          fetch-depth: 0

      - name: Apply deterministic manifest wiring
        run: python3 tools/ci/apply_widget_config_manifest.py

      - name: Validate diff
        run: git diff --check

      - name: Commit manifest wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml tools/ci/apply_widget_config_manifest.py .github/workflows/apply-widget-config-manifest.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Register digital widget configuration activity"
          git push origin HEAD:agent/widget-weight-config-ui
