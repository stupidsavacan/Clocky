name: Apply widget profile override wiring

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'app/**'
      - 'tools/ci/apply_widget_profile_overrides.py'
      - '.github/workflows/apply-widget-profile-overrides.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/widget-profile-overrides'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply narrow provider patch
        run: python3 tools/ci/apply_widget_profile_overrides.py

      - name: Verify diff shape
        run: |
          git diff --check
          git diff -- app/src/main/java/com/android/alarmclock/DigitalAppWidgetProvider.kt

      - name: Commit generated provider wiring
        run: |
          rm .github/workflows/apply-widget-profile-overrides.yml
          git add app/src/main/java/com/android/alarmclock/DigitalAppWidgetProvider.kt \
                  tools/ci/apply_widget_profile_overrides.py \
                  .github/workflows/apply-widget-profile-overrides.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire digital widget profile weights into renderer'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
