name: Apply standalone compile compatibility fix

on:
  push:
    branches:
      - agent/compile-bootstrap
    paths:
      - '.github/workflows/apply-compile-compat-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply public-API and non-final-R compatibility edits
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'app/src/main/java/com/android/deskclock/ClockFragment.kt': [
                  ('private const val MAIN_CLOCK = R.layout.main_clock_frame', 'private val MAIN_CLOCK = R.layout.main_clock_frame'),
                  ('private const val WORLD_CLOCK = R.layout.world_clock_item', 'private val WORLD_CLOCK = R.layout.world_clock_item'),
              ],
              'app/src/main/java/com/android/deskclock/LabelDialogFragment.kt': [
                  ('R.attr.colorControlActivated', 'androidx.appcompat.R.attr.colorControlActivated'),
                  ('R.attr.colorControlNormal', 'androidx.appcompat.R.attr.colorControlNormal'),
              ],
              'app/src/main/java/com/android/deskclock/alarms/AlarmActivity.kt': [
                  ('R.attr.colorAccent', 'androidx.appcompat.R.attr.colorAccent'),
              ],
              'app/src/main/java/com/android/deskclock/alarms/dataadapter/ExpandedAlarmViewHolder.kt': [
                  ('android.R.attr.selectableItemBackground', 'androidx.appcompat.R.attr.selectableItemBackground'),
              ],
              'app/src/main/java/com/android/deskclock/ringtone/HeaderViewHolder.kt': [
                  ('const val VIEW_TYPE_ITEM_HEADER = R.layout.ringtone_item_header', 'val VIEW_TYPE_ITEM_HEADER = R.layout.ringtone_item_header'),
              ],
              'app/src/main/java/com/android/deskclock/ringtone/RingtoneViewHolder.kt': [
                  ('android.R.attr.colorAccent', 'androidx.appcompat.R.attr.colorAccent'),
                  ('const val VIEW_TYPE_SYSTEM_SOUND = R.layout.ringtone_item_sound', 'val VIEW_TYPE_SYSTEM_SOUND = R.layout.ringtone_item_sound'),
                  ('const val VIEW_TYPE_CUSTOM_SOUND = -R.layout.ringtone_item_sound', 'val VIEW_TYPE_CUSTOM_SOUND = -R.layout.ringtone_item_sound'),
              ],
              'app/src/main/java/com/android/deskclock/settings/SimpleMenuPreference.kt': [
                  ('android.R.attr.dropdownPreferenceStyle', 'androidx.preference.R.attr.dropdownPreferenceStyle'),
              ],
              'app/src/main/java/com/android/deskclock/stopwatch/StopwatchCircleView.kt': [
                  ('android.R.attr.colorAccent', 'androidx.appcompat.R.attr.colorAccent'),
              ],
              'app/src/main/java/com/android/deskclock/stopwatch/StopwatchFragment.kt': [
                  ('android.R.attr.colorAccent', 'androidx.appcompat.R.attr.colorAccent'),
              ],
              'app/src/main/java/com/android/deskclock/timer/TimerCircleView.kt': [
                  ('android.R.attr.colorAccent', 'androidx.appcompat.R.attr.colorAccent'),
              ],
              'app/src/main/java/com/android/deskclock/timer/TimerItem.kt': [
                  ('android.R.attr.colorAccent', 'androidx.appcompat.R.attr.colorAccent'),
              ],
              'app/src/main/java/com/android/deskclock/timer/TimerSetupView.kt': [
                  ('android.R.attr.colorControlActivated', 'androidx.appcompat.R.attr.colorControlActivated'),
                  ('android.R.attr.colorControlNormal', 'androidx.appcompat.R.attr.colorControlNormal'),
              ],
          }

          for name, edits in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print(f'updated {name}')

      - name: Commit compatibility edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git diff --cached --check
          git commit -m 'Adapt AOSP attrs and resource IDs for standalone AGP build'
          git push origin HEAD:agent/compile-bootstrap
