name: Compile Fix Round 1

on:
  push:
    branches:
      - agent/compile-bootstrap
    paths:
      - '.github/workflows/compile-fix-round1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply standalone resource compatibility fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'R.attr.colorControlActivated': 'android.R.attr.colorControlActivated',
              'R.attr.colorControlNormal': 'android.R.attr.colorControlNormal',
              'R.attr.colorAccent': 'android.R.attr.colorAccent',
              'R.attr.selectableItemBackground': 'android.R.attr.selectableItemBackground',
              'R.attr.dropdownPreferenceStyle': 'android.R.attr.dropdownPreferenceStyle',
          }
          root = Path('app/src/main/java')
          changed = []
          for path in root.rglob('*.kt'):
              text = path.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          # Android resource IDs are no longer compile-time constants under modern AGP.
          targeted = {
              Path('app/src/main/java/com/android/deskclock/ClockFragment.kt'): [
                  'private const val MAIN_CLOCK = R.layout.main_clock_frame',
                  'private const val WORLD_CLOCK = R.layout.world_clock_item',
              ],
              Path('app/src/main/java/com/android/deskclock/ringtone/HeaderViewHolder.kt'): [
                  'private const val VIEW_TYPE = R.layout.ringtone_item_header',
              ],
              Path('app/src/main/java/com/android/deskclock/ringtone/RingtoneViewHolder.kt'): [
                  'private const val SYSTEM_VIEW_TYPE = R.layout.ringtone_item_sound',
                  'private const val CUSTOM_VIEW_TYPE = R.layout.ringtone_item_sound',
              ],
          }
          for path, needles in targeted.items():
              text = path.read_text(encoding='utf-8')
              new = text
              for needle in needles:
                  new = new.replace(needle, needle.replace('private const val', 'private val'))
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('\n'.join(sorted(set(changed))))

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix AOSP resource references for modern AGP'
          git push origin HEAD:agent/compile-bootstrap
