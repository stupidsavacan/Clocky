name: Phase 2-7 AOSP standalone port

on:
  push:
    branches:
      - agent/complete-12-phase-port
    paths:
      - '.github/workflows/phase-2-7-port.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Phase 2 - copy AOSP source into app tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p legacy/mvp-app-skeleton
          if [ ! -f legacy/mvp-app-skeleton/.captured ]; then
            cp -a app/. legacy/mvp-app-skeleton/
            touch legacy/mvp-app-skeleton/.captured
          fi
          rm -rf app/src/main/java app/src/main/res app/src/main/assets
          mkdir -p app/src/main/java app/src/main/res app/src/main/assets
          cp -a third_party/aosp-deskclock/src/. app/src/main/java/
          cp -a third_party/aosp-deskclock/res/. app/src/main/res/
          cp -a third_party/aosp-deskclock/assets/. app/src/main/assets/

      - name: Phase 3 - write standalone Gradle configuration
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              // Keep the AOSP package namespace during the direct-port phase so
              // source imports and relative manifest class names remain unchanged.
              namespace = "com.android.deskclock"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.stupidsavacan.clocky"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2.0-aosp-port"
              }

              buildFeatures {
                  buildConfig = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  resources {
                      excludes += setOf(
                          "META-INF/AL2.0",
                          "META-INF/LGPL2.1"
                      )
                  }
              }
          }

          dependencies {
              implementation("androidx.annotation:annotation:1.9.1")
              implementation("androidx.collection:collection:1.4.5")
              implementation("androidx.arch.core:core-common:2.2.0")
              implementation("androidx.lifecycle:lifecycle-common:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.percentlayout:percentlayout:1.0.0")
              implementation("androidx.transition:transition:1.5.1")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.legacy:legacy-support-core-ui:1.0.0")
              implementation("androidx.media:media:1.7.0")
              implementation("androidx.legacy:legacy-support-v13:1.0.0")
              implementation("androidx.preference:preference-ktx:1.2.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.gridlayout:gridlayout:1.0.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF

      - name: Phase 4 - adapt Manifest for standalone Gradle application
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          src = Path('third_party/aosp-deskclock/AndroidManifest.xml')
          dst = Path('app/src/main/AndroidManifest.xml')
          tree = ET.parse(src)
          root = tree.getroot()
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)

          # AGP owns namespace/minSdk/targetSdk. Preserve component declarations.
          root.attrib.pop('package', None)
          for child in list(root):
              local = child.tag.split('}')[-1]
              if local in {'uses-sdk', 'original-package'}:
                  root.remove(child)

          app = next((c for c in root if c.tag.split('}')[-1] == 'application'), None)
          if app is None:
              raise SystemExit('application element not found')

          # Standalone apps must not claim AOSP's fixed provider authority.
          for element in app.iter():
              if element.tag.split('}')[-1] == 'provider':
                  key = f'{{{android}}}authorities'
                  if element.attrib.get(key) == 'com.android.deskclock':
                      element.set(key, '${applicationId}')

          ET.indent(tree, space='    ')
          tree.write(dst, encoding='utf-8', xml_declaration=True)

      - name: Phase 5 - verify resource and asset mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/port
          SRC_RES=$(find third_party/aosp-deskclock/res -type f | wc -l)
          APP_RES=$(find app/src/main/res -type f | wc -l)
          SRC_ASSETS=$(find third_party/aosp-deskclock/assets -type f | wc -l)
          APP_ASSETS=$(find app/src/main/assets -type f | wc -l)
          SRC_CODE=$(find third_party/aosp-deskclock/src -type f | wc -l)
          APP_CODE=$(find app/src/main/java -type f | wc -l)
          cat > docs/port/AOSP_MIRROR_STATUS.md <<EOF
          # AOSP mirror status

          Generated from pinned `android-17.0.0_r1` vendor source.

          | Area | Upstream files | Port files | Status |
          |---|---:|---:|---|
          | source | $SRC_CODE | $APP_CODE | $([ "$SRC_CODE" = "$APP_CODE" ] && echo 'mirrored' || echo 'mismatch') |
          | resources | $SRC_RES | $APP_RES | $([ "$SRC_RES" = "$APP_RES" ] && echo 'mirrored' || echo 'mismatch') |
          | assets | $SRC_ASSETS | $APP_ASSETS | $([ "$SRC_ASSETS" = "$APP_ASSETS" ] && echo 'mirrored' || echo 'mismatch') |

          `third_party/aosp-deskclock/` remains the immutable provenance copy. `app/` is the standalone adaptation tree.
          EOF
          test "$SRC_RES" = "$APP_RES"
          test "$SRC_ASSETS" = "$APP_ASSETS"
          test "$SRC_CODE" = "$APP_CODE"

      - name: Phase 6-7 - scan platform APIs and map dependencies
        shell: python
        run: |
          from pathlib import Path
          import re, json, collections

          roots = [Path('app/src/main/java')]
          files = [p for r in roots for p in r.rglob('*') if p.suffix in {'.kt', '.java'}]

          risky_patterns = {
              'com.android.internal': re.compile(r'\bcom\.android\.internal\b'),
              'android.internal': re.compile(r'\bandroid\.internal\b'),
              'SystemProperties': re.compile(r'\bandroid\.os\.SystemProperties\b|\bSystemProperties\b'),
              'hidden annotation': re.compile(r'UnsupportedAppUsage|@hide'),
              'framework internal resource': re.compile(r'com\.android\.internal\.R|@android:id/|@android:string/'),
              'reflection into android': re.compile(r'(Class\.forName|getDeclaredMethod|getDeclaredField).*android\.'),
          }

          findings = []
          imports = collections.Counter()
          import_sites = collections.defaultdict(list)
          android_symbols = collections.Counter()

          import_re = re.compile(r'^\s*import\s+([^\s;]+)', re.M)
          for p in files:
              text = p.read_text(encoding='utf-8', errors='replace')
              rel = p.as_posix()
              for imp in import_re.findall(text):
                  imports[imp] += 1
                  import_sites[imp].append(rel)
                  if imp.startswith('android.'):
                      android_symbols[imp] += 1
              for label, rx in risky_patterns.items():
                  for m in rx.finditer(text):
                      line = text.count('\n', 0, m.start()) + 1
                      findings.append({'kind': label, 'file': rel, 'line': line, 'match': m.group(0)[:120]})

          docs = Path('docs/port')
          docs.mkdir(parents=True, exist_ok=True)
          with (docs / 'platform-api-scan.json').open('w', encoding='utf-8') as f:
              json.dump({'source_files': len(files), 'findings': findings}, f, indent=2, ensure_ascii=False)

          by_kind = collections.Counter(x['kind'] for x in findings)
          lines = [
              '# Platform API static scan', '',
              'This is a pre-build static scan. It intentionally over-reports suspicious platform coupling; compiler/API-lint validation comes later.', '',
              f'- Source files scanned: **{len(files)}**',
              f'- Suspicious references: **{len(findings)}**', '',
              '## Summary', '',
              '| Kind | Count |', '|---|---:|',
          ]
          lines += [f'| {k} | {v} |' for k, v in sorted(by_kind.items())]
          lines += ['', '## Findings', '', '| Kind | File | Line | Match |', '|---|---|---:|---|']
          for x in findings:
              lines.append(f"| {x['kind']} | `{x['file']}` | {x['line']} | `{x['match'].replace('|','\\|')}` |")
          if not findings:
              lines.append('| none detected | - | - | - |')
          (docs / 'PLATFORM_API_SCAN.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          static_map = [
              ('androidx.annotation_annotation', 'androidx.annotation', 'androidx.annotation:annotation:1.9.1'),
              ('androidx.collection_collection', 'androidx.collection', 'androidx.collection:collection:1.4.5'),
              ('androidx.arch.core_core-common', 'androidx.arch.core', 'androidx.arch.core:core-common:2.2.0'),
              ('androidx.lifecycle_lifecycle-common', 'androidx.lifecycle', 'androidx.lifecycle:lifecycle-common:2.8.7'),
              ('androidx.lifecycle_lifecycle-runtime', 'androidx.lifecycle', 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'),
              ('com.google.android.material_material', 'com.google.android.material', 'com.google.android.material:material:1.12.0'),
              ('androidx.percentlayout_percentlayout', 'androidx.percentlayout', 'androidx.percentlayout:percentlayout:1.0.0'),
              ('androidx.transition_transition', 'androidx.transition', 'androidx.transition:transition:1.5.1'),
              ('androidx.core_core', 'androidx.core', 'androidx.core:core-ktx:1.15.0'),
              ('androidx.legacy_legacy-support-core-ui', 'androidx.legacy', 'androidx.legacy:legacy-support-core-ui:1.0.0'),
              ('androidx.media_media', 'androidx.media', 'androidx.media:media:1.7.0'),
              ('androidx.legacy_legacy-support-v13', 'androidx.legacy.app', 'androidx.legacy:legacy-support-v13:1.0.0'),
              ('androidx.preference_preference', 'androidx.preference', 'androidx.preference:preference-ktx:1.2.1'),
              ('androidx.appcompat_appcompat', 'androidx.appcompat', 'androidx.appcompat:appcompat:1.7.0'),
              ('androidx.gridlayout_gridlayout', 'androidx.gridlayout', 'androidx.gridlayout:gridlayout:1.0.0'),
              ('androidx.recyclerview_recyclerview', 'androidx.recyclerview', 'androidx.recyclerview:recyclerview:1.3.2'),
          ]
          dep_lines = [
              '# AOSP Soong → Gradle dependency map', '',
              'Mappings come from the pinned DeskClock `Android.bp` plus imports found in the copied source tree.', '',
              '| AOSP static_lib | Import prefix | Gradle coordinate | Imported symbols |',
              '|---|---|---|---:|'
          ]
          for soong, prefix, gradle in static_map:
              count = sum(v for k, v in imports.items() if k.startswith(prefix))
              dep_lines.append(f'| `{soong}` | `{prefix}` | `{gradle}` | {count} |')

          external = sorted((k, v) for k, v in imports.items() if k.startswith('androidx.') or k.startswith('com.google.android.material'))
          dep_lines += ['', '## Imported external symbols', '', '| Import | Count |', '|---|---:|']
          dep_lines += [f'| `{k}` | {v} |' for k, v in external]
          (docs / 'DEPENDENCY_MAP.md').write_text('\n'.join(dep_lines) + '\n', encoding='utf-8')

          # Machine-readable inventory for later build-fix work.
          with (docs / 'dependency-imports.json').open('w', encoding='utf-8') as f:
              json.dump(dict(sorted(imports.items())), f, indent=2, ensure_ascii=False)

      - name: Phase 2-7 status
        shell: bash
        run: |
          cat > docs/port/PHASE_2_7_STATUS.md <<'EOF'
          # Phase 2–7 status

          - [x] Phase 2: AOSP functional source copied to standalone `app/`
          - [x] Phase 3: Soong dependency list translated into Gradle configuration
          - [x] Phase 4: AOSP Manifest copied and minimally adapted for AGP/applicationId
          - [x] Phase 5: AOSP resources/assets mirrored and file-count verified
          - [x] Phase 6: static platform-only/hidden-API risk scan generated
          - [x] Phase 7: AndroidX/Material dependency mapping generated

          No APK or Gradle compile is performed by this workflow.
          EOF

      - name: Commit generated direct port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app legacy docs/port
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Phase 2-7: AOSP DeskClockをstandalone appへ直接移植'
          git push origin HEAD:agent/complete-12-phase-port
