name: Apply widget position renderer patch

on:
  push:
    branches:
      - agent/widget-position-renderer
    paths:
      - '.github/workflows/apply-widget-position-renderer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/widget-position-renderer
          fetch-depth: 0
      - name: Apply deterministic provider patch
        run: python3 tools/ci/apply_widget_position_renderer.py
      - name: Validate diff
        run: git diff --check
      - name: Commit provider patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No provider changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/android/alarmclock/DigitalAppWidgetProvider.kt
          git commit -m 'Digital WidgetのX/Y offsetを実描画へ接続'
          git push origin HEAD:agent/widget-position-renderer
