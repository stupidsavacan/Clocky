name: Current App CI

on:
  push:
    branches:
      - agent/compile-bootstrap
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/current-app-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/current-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Require Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Record toolchain metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-metadata
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            echo "java_version=$(java -version 2>&1 | head -n 1)"
            echo "sdk_root=${ANDROID_SDK_ROOT}"
            echo "compile_sdk=35"
            echo "target_sdk=35"
            echo "build_tools=35.0.0"
            echo '--- gradle ---'
            ./gradlew --version
          } > build/ci-metadata/build-metadata.txt

      - name: Resolve debug runtime dependencies
        run: ./gradlew --no-daemon --stacktrace :app:dependencies --configuration debugRuntimeClasspath

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Hash debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          sha256sum "$APK" | tee build/ci-metadata/APK-SHA256.txt
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
        id: apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clocky-current-app-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            build/ci-metadata/build-metadata.txt
            build/ci-metadata/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clocky-current-app-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            build/ci-metadata/build-metadata.txt
          if-no-files-found: warn
          retention-days: 14
