name: Current App CI
# Validates the idempotent standalone-port remediation head.

on:
  push:
    branches:
      - agent/compile-bootstrap
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/current-app-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/current-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 and Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Require Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Record toolchain metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-metadata
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            echo "java_version=$(java -version 2>&1 | head -n 1)"
            echo "sdk_root=${ANDROID_SDK_ROOT}"
            echo "compile_sdk=35"
            echo "target_sdk=35"
            echo "build_tools=35.0.0"
            echo '--- gradle ---'
            ./gradlew --version
          } > build/ci-metadata/build-metadata.txt

      - name: Resolve debug runtime dependencies
        run: ./gradlew --no-daemon --stacktrace :app:dependencies --configuration debugRuntimeClasspath

      - name: Compile current app
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Summarize lint errors
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('app/build/reports/lint-results-debug.xml')
          output = Path('build/ci-metadata/lint-errors.txt')
          if not report.exists():
              output.write_text('lint XML report not found\n', encoding='utf-8')
              print('lint XML report not found')
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          errors = []
          for issue in root.findall('issue'):
              if issue.attrib.get('severity') != 'Error':
                  continue
              location = issue.find('location')
              file_name = location.attrib.get('file', '-') if location is not None else '-'
              line = location.attrib.get('line', '-') if location is not None else '-'
              errors.append((
                  issue.attrib.get('id', 'unknown'),
                  file_name,
                  line,
                  issue.attrib.get('message', '').replace('\n', ' '),
              ))

          lines = [f'Lint errors: {len(errors)}']
          lines.extend(f'{i:03d}. [{kind}] {file_name}:{line}: {message}' for i, (kind, file_name, line, message) in enumerate(errors, 1))
          text = '\n'.join(lines) + '\n'
          output.write_text(text, encoding='utf-8')
          print(text)

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Hash debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          sha256sum "$APK" | tee build/ci-metadata/APK-SHA256.txt
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
        id: apk

      - name: Upload debug APK
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: clocky-current-app-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            build/ci-metadata/build-metadata.txt
            build/ci-metadata/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        id: upload_reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: clocky-current-app-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
            build/ci-metadata/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce lint result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo 'Lint failed; see the summarized errors above.' >&2
            exit 1
          fi

      - name: Record artifact quota fallback status
        if: always()
        shell: bash
        run: |
          {
            echo '### Artifact upload status'
            echo "- APK artifact step: ${{ steps.upload_apk.outcome }}"
            echo "- report artifact step: ${{ steps.upload_reports.outcome }}"
            echo '- Build/test/lint failures remain fatal; artifact quota failures are reported separately.'
          } >> "$GITHUB_STEP_SUMMARY"
