name: Agent font patch export

on:
  push:
    branches:
      - agent/widget-font-family-renderer

permissions:
  contents: read

jobs:
  export-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply font-family compatibility patch
        run: python ci/agent_font_family_patch.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -f app/src/main/java/com/stupidsavacan/clocky/customization/font/LegacyWidgetFontFamilyPolicy.kt
          test -f app/src/test/java/com/stupidsavacan/clocky/customization/font/LegacyWidgetFontFamilyPolicyTest.kt

      - name: Package patched sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patch-export
          cp --parents \
            app/src/main/java/com/android/alarmclock/DigitalAppWidgetProvider.kt \
            app/src/main/java/com/stupidsavacan/clocky/customization/font/DigitalWidgetWeightRenderer.kt \
            app/src/main/java/com/stupidsavacan/clocky/customization/font/LegacyWidgetFontFamilyPolicy.kt \
            app/src/main/java/com/stupidsavacan/clocky/customization/position/DigitalWidgetOffsetRenderer.kt \
            app/src/main/res/layout/digital_widget.xml \
            app/src/test/java/com/stupidsavacan/clocky/customization/font/LegacyWidgetFontFamilyPolicyTest.kt \
            patch-export/
          tar -C patch-export -czf font-family-patch.tgz app
          sha256sum font-family-patch.tgz

      - name: Emit patch archive fallback
        shell: bash
        run: |
          set -euo pipefail
          echo 'CLOCKY_FONT_PATCH_BASE64_BEGIN'
          base64 font-family-patch.tgz
          echo 'CLOCKY_FONT_PATCH_BASE64_END'

      - name: Upload patched sources
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-font-family-patch-${{ github.sha }}
          path: font-family-patch.tgz
          if-no-files-found: error
          retention-days: 1
