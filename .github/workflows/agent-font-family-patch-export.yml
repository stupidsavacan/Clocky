name: Agent font patch export

on:
  push:
    branches:
      - agent/widget-font-family-renderer

permissions:
  contents: read

jobs:
  export-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply font-family compatibility patch
        run: python ci/agent_font_family_patch.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Emit patched files
        shell: bash
        run: |
          set -euo pipefail
          emit() {
            local label="$1"
            local path="$2"
            echo "CLOCKY_FILE_${label}_BEGIN"
            base64 -w0 "$path"
            echo
            echo "CLOCKY_FILE_${label}_END"
          }
          emit PROVIDER app/src/main/java/com/android/alarmclock/DigitalAppWidgetProvider.kt
          emit RENDERER app/src/main/java/com/stupidsavacan/clocky/customization/font/DigitalWidgetWeightRenderer.kt
          emit POLICY app/src/main/java/com/stupidsavacan/clocky/customization/font/LegacyWidgetFontFamilyPolicy.kt
          emit OFFSET app/src/main/java/com/stupidsavacan/clocky/customization/position/DigitalWidgetOffsetRenderer.kt
          emit LAYOUT app/src/main/res/layout/digital_widget.xml
          emit TEST app/src/test/java/com/stupidsavacan/clocky/customization/font/LegacyWidgetFontFamilyPolicyTest.kt
