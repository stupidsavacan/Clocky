name: Clocky MVP Build Sign Release

on:
  workflow_dispatch:
  push:
    branches:
      - agent/mvp-java
    paths:
      - 'ci/Clocky_MVP_source.zip'
      - 'ci/GenerateJks.java'
      - '.github/workflows/mvp-build-sign.yml'

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Clocky source
        shell: bash
        run: |
          rm -rf mvp-work
          mkdir -p mvp-work
          unzip -t ci/Clocky_MVP_source.zip
          unzip -q ci/Clocky_MVP_source.zip -d mvp-work
          test -f mvp-work/clocky_mvp/settings.gradle.kts

      - name: Build unsigned release APK
        working-directory: mvp-work/clocky_mvp
        shell: bash
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate JKS using Java
        shell: bash
        run: |
          mkdir -p signing out
          cp ci/GenerateJks.java signing/GenerateJks.java
          javac --add-exports java.base/sun.security.tools.keytool=ALL-UNNAMED --add-exports java.base/sun.security.x509=ALL-UNNAMED signing/GenerateJks.java
          java --add-exports java.base/sun.security.tools.keytool=ALL-UNNAMED --add-exports java.base/sun.security.x509=ALL-UNNAMED -cp signing GenerateJks "$GITHUB_WORKSPACE/out/Clocky-MVP-release.jks" "$GITHUB_WORKSPACE/signing"

      - name: Align and sign APK
        shell: bash
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          U="$GITHUB_WORKSPACE/mvp-work/clocky_mvp/app/build/outputs/apk/release/app-release-unsigned.apk"
          A="$GITHUB_WORKSPACE/out/Clocky-MVP-aligned.apk"
          S="$GITHUB_WORKSPACE/out/Clocky-MVP-signed.apk"
          "$BT/zipalign" -f 4 "$U" "$A"
          "$BT/apksigner" sign --ks "$GITHUB_WORKSPACE/out/Clocky-MVP-release.jks" --ks-key-alias clocky --ks-pass "file:$GITHUB_WORKSPACE/signing/storepass.txt" --key-pass "file:$GITHUB_WORKSPACE/signing/keypass.txt" --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" | tee "$GITHUB_WORKSPACE/out/apksigner-verify.txt"

      - name: Record metadata
        shell: bash
        run: |
          cp signing/Clocky-signing-info.txt out/Clocky-signing-info.txt
          cp signing/storepass.txt out/storepass.txt
          cp signing/keypass.txt out/keypass.txt
          cp ci/GenerateJks.java out/GenerateJks.java
          cp ci/Clocky_MVP_source.zip out/Clocky_MVP_source.zip
          (cd out && sha256sum Clocky-MVP-signed.apk Clocky-MVP-release.jks Clocky_MVP_source.zip GenerateJks.java > SHA256SUMS.txt)
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging out/Clocky-MVP-signed.apk > out/aapt-badging.txt

      - name: Publish private repository release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="clocky-mvp-20260814-1237"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            out/Clocky-MVP-signed.apk \
            out/Clocky-MVP-release.jks \
            out/Clocky-signing-info.txt \
            out/storepass.txt \
            out/keypass.txt \
            out/SHA256SUMS.txt \
            out/apksigner-verify.txt \
            out/aapt-badging.txt \
            out/GenerateJks.java \
            out/Clocky_MVP_source.zip \
            --target "$GITHUB_SHA" \
            --title "Clocky MVP — Java-generated JKS" \
            --notes "Clocky MVP build. The signing JKS was generated by Java code (GenerateJks.java), then the APK was zipaligned, signed with apksigner, and verified. This repository is private; keep the JKS and password files private." \
            --prerelease
