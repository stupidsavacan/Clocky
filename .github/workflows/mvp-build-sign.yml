name: Clocky MVP Build Sign Recover

on:
  workflow_dispatch:
  push:
    branches:
      - agent/mvp-java
    paths:
      - 'ci/Clocky_MVP_source.zip'
      - 'ci/GenerateJks.java'
      - '.github/workflows/mvp-build-sign.yml'

permissions:
  contents: write

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Clocky source
        shell: bash
        run: |
          rm -rf mvp-work
          mkdir -p mvp-work
          unzip -t ci/Clocky_MVP_source.zip
          unzip -q ci/Clocky_MVP_source.zip -d mvp-work
          test -f mvp-work/clocky_mvp/settings.gradle.kts

      - name: Build unsigned release APK
        working-directory: mvp-work/clocky_mvp
        shell: bash
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate JKS using Java
        shell: bash
        run: |
          mkdir -p signing out
          cp ci/GenerateJks.java signing/GenerateJks.java
          javac --add-exports java.base/sun.security.tools.keytool=ALL-UNNAMED --add-exports java.base/sun.security.x509=ALL-UNNAMED signing/GenerateJks.java
          java --add-exports java.base/sun.security.tools.keytool=ALL-UNNAMED --add-exports java.base/sun.security.x509=ALL-UNNAMED -cp signing GenerateJks "$GITHUB_WORKSPACE/out/Clocky-MVP-release.jks" "$GITHUB_WORKSPACE/signing"

      - name: Align and sign APK
        shell: bash
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          U="$GITHUB_WORKSPACE/mvp-work/clocky_mvp/app/build/outputs/apk/release/app-release-unsigned.apk"
          A="$GITHUB_WORKSPACE/out/Clocky-MVP-aligned.apk"
          S="$GITHUB_WORKSPACE/out/Clocky-MVP-signed.apk"
          "$BT/zipalign" -f 4 "$U" "$A"
          "$BT/apksigner" sign --ks "$GITHUB_WORKSPACE/out/Clocky-MVP-release.jks" --ks-key-alias clocky --ks-pass "file:$GITHUB_WORKSPACE/signing/storepass.txt" --key-pass "file:$GITHUB_WORKSPACE/signing/keypass.txt" --out "$S" "$A"
          "$BT/apksigner" verify --verbose --print-certs "$S" | tee "$GITHUB_WORKSPACE/out/apksigner-verify.txt"

      - name: Record metadata
        shell: bash
        run: |
          cp signing/Clocky-signing-info.txt out/Clocky-signing-info.txt
          cp signing/storepass.txt out/storepass.txt
          cp signing/keypass.txt out/keypass.txt
          cp ci/GenerateJks.java out/GenerateJks.java
          cp ci/Clocky_MVP_source.zip out/Clocky_MVP_source.zip
          (cd out && sha256sum Clocky-MVP-signed.apk Clocky-MVP-release.jks Clocky_MVP_source.zip GenerateJks.java > SHA256SUMS.txt)
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging out/Clocky-MVP-signed.apk > out/aapt-badging.txt

      - name: Encrypt export with recovery public key
        shell: bash
        run: |
          cat > recovery-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAm7tvJ84gxrEVz6yQoi3M
          oyMc1y1o1YkKsS/WNLTaw/ywlrXE1JAwfy+sxgVPQe0B/H1olJFLi2FNNZlB05Z4
          h3d9W+m6+mp//xMvqNb0GIWKLM+6+kzLK7Y+WZvV1vYcr8i3z31h/yqrkGVYD2EY
          SNZy46ghIjxnz4T9toH0Y5duhlmugrcj/PQX3rjLqtEI+pNPNpjLSqkVZ/qghLQu
          YFOkEKdtG8D4pRHEQEmzfvRE8UvJHrZY0ycQHE1Hw3weuZuNJ8V5ltL6UIzBpZbN
          7TqUayaNvY4SmHMJlmPm1UGTcNuX9Jbf9PWId5buy6nRClvReL75n02yI3+DsV48
          H2Q6DVta80gEUFj/dSBB3F6mUMHlrphkc5d+GB+WAGF8Onx5W4krn5Mr9zDD2l4d
          RjTuLZvzq1T0sFQGIhjqlWIXzsyOWVlf5xQeCR6879KhZq9TtH+XzDPxNDucYkMK
          8rNdOxqy2h3DHPLmPCKEK3Av1nBak+z+Truxo4dREvvVAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -C out -czf Clocky-MVP-plain.tgz .
          openssl rand -base64 48 > recovery-pass.txt
          mkdir -p build-export
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in Clocky-MVP-plain.tgz -out build-export/Clocky-MVP-export.enc -pass file:recovery-pass.txt
          openssl pkeyutl -encrypt -pubin -inkey recovery-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in recovery-pass.txt -out build-export/Clocky-MVP-export-key.enc
          sha256sum build-export/Clocky-MVP-export.enc build-export/Clocky-MVP-export-key.enc > build-export/SHA256SUMS.txt
          rm -f Clocky-MVP-plain.tgz recovery-pass.txt

      - name: Commit encrypted recovery export
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-export/Clocky-MVP-export.enc build-export/Clocky-MVP-export-key.enc build-export/SHA256SUMS.txt
          git commit -m "Export encrypted Clocky MVP build"
          git push origin HEAD:agent/mvp-java
