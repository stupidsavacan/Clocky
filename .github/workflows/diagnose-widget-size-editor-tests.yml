name: Diagnose widget size editor tests

on:
  push:
    branches:
      - agent/widget-size-config-ui
    paths:
      - '.github/workflows/diagnose-widget-size-editor-tests.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: stateKeepsPerFieldInheritance
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.stupidsavacan.clocky.customization.ui.WidgetProfileSizeEditorTest.stateKeepsPerFieldInheritance'
      - name: disablingSizeOverridePreservesOtherProfileFields
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.stupidsavacan.clocky.customization.ui.WidgetProfileSizeEditorTest.disablingSizeOverridePreservesOtherProfileFields'
      - name: disablingSizeOnlyProfileCollapsesToNull
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.stupidsavacan.clocky.customization.ui.WidgetProfileSizeEditorTest.disablingSizeOnlyProfileCollapsesToNull'
      - name: enabledProfileCanOverrideOnlyOneSizeField
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.stupidsavacan.clocky.customization.ui.WidgetProfileSizeEditorTest.enabledProfileCanOverrideOnlyOneSizeField'
      - name: applyUpdatesProfilesIndependentlyAndClampsMinimum
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.stupidsavacan.clocky.customization.ui.WidgetProfileSizeEditorTest.applyUpdatesProfilesIndependentlyAndClampsMinimum'
