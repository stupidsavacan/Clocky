name: AOSP Port Remediation

on:
  push:
    branches:
      - agent/compile-bootstrap
    paths:
      - 'tools/ci/remediate_aosp_port.py'
      - 'tools/ci/remediate_runtime_lint.py'
      - 'tools/ci/remediate_resource_lint.py'
      - 'tools/ci/remediate_pending_intent_flags.py'
      - '.github/workflows/aosp-port-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/compile-bootstrap
          fetch-depth: 0

      - name: Apply deterministic port fixes
        run: python tools/ci/remediate_aosp_port.py

      - name: Apply runtime lint fixes
        run: python tools/ci/remediate_runtime_lint.py

      - name: Apply targeted resource lint fixes
        run: python tools/ci/remediate_resource_lint.py

      - name: Apply PendingIntent mutability fixes
        run: python tools/ci/remediate_pending_intent_flags.py

      - name: Validate patch
        run: git diff --check

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No remediation changes required.'
            exit 0
          fi
          git config user.name 'clocky-ci'
          git config user.email 'clocky-ci@users.noreply.github.com'
          git add app/src/main
          git commit -m 'Remediate standalone AOSP runtime compatibility'
          git push origin HEAD:agent/compile-bootstrap
